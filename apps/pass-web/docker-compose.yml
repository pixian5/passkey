services:
  pass-web:
    build:
      context: ../..
      dockerfile: apps/pass-web/Dockerfile
    image: ${PASS_WEB_IMAGE:-pass-web:latest}
    restart: unless-stopped
    ports:
      - "${PASS_WEB_BIND_ADDRESS:-127.0.0.1}:${PASS_WEB_PORT:-53335}:53335"
    environment:
      PASS_WEB_AUTH_TOKEN: ${PASS_WEB_AUTH_TOKEN:-}
      # Safe only while the published host port remains loopback-only.
      PASS_WEB_TRUSTED_LOOPBACK_PROXY: ${PASS_WEB_TRUSTED_LOOPBACK_PROXY:-1}
    volumes:
      - pass_web_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:53335/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  pass_web_data:
