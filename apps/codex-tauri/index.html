<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pass Desktop</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="lockOverlay" class="lock-overlay" hidden>
      <div class="lock-card">
        <h2>Pass 已锁定</h2>
        <p class="hint">输入主密码解锁 vault 与同步密钥。</p>
        <label>主密码<input id="unlockPassword" type="password" autocomplete="current-password" /></label>
        <div class="form-actions">
          <button type="button" id="btn-unlock" class="primary">解锁</button>
        </div>
        <p id="lockError" class="error"></p>
      </div>
    </div>

    <main class="shell" id="appMain">
      <!-- Intentionally no heavy toolbar — PassMac uses menu bar; keep minimal chrome -->
      <div class="titlebar-drag">
        <div class="titlebar-left">
          <span class="app-title">Pass</span>
          <span class="muted" id="deviceLabel"></span>
        </div>
        <div class="titlebar-right">
          <button type="button" id="btn-new" class="primary">新建账号</button>
          <button type="button" id="btn-sync-now">同步</button>
          <button type="button" id="btn-open-settings">设置</button>
          <button type="button" id="btn-lock-now">锁定</button>
        </div>
      </div>

      <div class="workspace">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-inner">
            <button type="button" class="side-item active" data-filter="all">
              <span id="label-all">全部 (0)</span>
            </button>
            <button type="button" class="side-item" data-filter="passkeys">
              <span id="label-passkeys">通行密钥 (0)</span>
            </button>
            <button type="button" class="side-item" data-filter="totp">
              <span id="label-totp">验证码 (0)</span>
            </button>
            <button type="button" class="side-item" data-filter="recycle">
              <span id="label-recycle">回收站 (0)</span>
            </button>

            <div class="side-divider"></div>

            <div class="folder-head" id="folderHead">
              <span id="label-folders">文件夹 (0)</span>
              <button type="button" class="folder-new" id="btn-new-folder">新建</button>
            </div>
            <div id="folderEmpty" class="folder-empty" hidden>暂无文件夹</div>
            <div class="folder-scroll" id="folderList"></div>

            <div class="sidebar-spacer"></div>
          </div>
        </aside>

        <section class="content">
          <div class="search-wrap">
            <button type="button" class="icon-ghost" id="btn-sort" title="排序">⇅</button>
            <input id="searchInput" type="search" placeholder="搜索全部账号（输入即搜）" />
            <select id="sortMode" class="sort-select" title="排序">
              <option value="default">默认排序</option>
              <option value="updatedNewest">最近修改</option>
              <option value="usernameAZ">用户名 A-Z</option>
              <option value="siteAZ">站点 A-Z</option>
            </select>
          </div>

          <div id="listEmpty" class="list-empty" hidden>暂无账号</div>
          <div class="account-scroll">
            <div class="account-stack" id="accountRows"></div>
          </div>
        </section>
      </div>

      <div class="toast" id="output" hidden></div>
    </main>

    <!-- Edit sheet -->
    <div id="editModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-edit></div>
      <div class="modal-card account-editor-card">
        <header class="modal-head">
          <h2 id="editTitle">编辑账号</h2>
          <button type="button" class="icon-btn" data-close-edit>×</button>
        </header>
        <form id="accountForm" class="modal-body">
          <input type="hidden" id="accountId" />
          <label class="account-field account-sites-field">站点别名（每行一个）
            <textarea id="sites" required rows="4"></textarea>
          </label>
          <label class="account-inline-field"><span>用户名</span><input id="username" required placeholder="例如 alice@icloud.com" /></label>
          <label class="account-inline-field"><span>密码</span><span class="secret-field"><input id="password" type="password" required placeholder="请输入密码" /><button type="button" class="icon-btn secret-toggle" data-toggle-secret="password" title="显示密码" aria-label="显示密码">◎</button></span></label>
          <section class="account-totp-field">
            <label class="account-inline-field"><span>TOTP</span><span class="secret-field"><input id="totpSecret" type="password" placeholder="TOTP 种子密钥" /><button type="button" class="icon-btn secret-toggle" data-toggle-secret="totpSecret" title="显示 TOTP 密钥" aria-label="显示 TOTP 密钥">◎</button></span></label>
            <div class="totp-actions">
              <button type="button" id="btn-paste-totp-raw">粘贴原始密钥</button>
              <button type="button" id="btn-paste-totp-uri">粘贴完整 otpauth URI</button>
              <button type="button" id="btn-paste-totp-qr">粘贴二维码</button>
            </div>
          </section>
          <label class="account-field">恢复码<textarea id="recoveryCodes" rows="4"></textarea></label>
          <label class="account-field">备注<textarea id="note" rows="5"></textarea></label>
          <label class="account-field account-folders-field">文件夹（⌘/Ctrl 多选）
            <select id="editFolders" multiple size="5"></select>
          </label>
          <div class="form-actions account-actions">
            <button type="button" id="btn-create-stay">创建账号</button>
            <button type="submit" class="primary" id="btn-save-account">创建并关闭</button>
            <button type="button" id="btn-restore" class="primary" hidden>恢复账号</button>
            <button type="button" id="btn-delete" class="danger">移入回收站</button>
            <button type="button" data-close-edit id="btn-close-account">关闭</button>
          </div>
        </form>
      </div>
    </div>

    <div id="folderModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-folder></div>
      <div class="modal-card sm">
        <header class="modal-head">
          <h2>新建文件夹</h2>
          <button type="button" class="icon-btn" data-close-folder>×</button>
        </header>
        <div class="modal-body">
          <label>名称<input id="newFolderName" /></label>
          <div class="form-actions">
            <button type="button" class="primary" id="btn-create-folder">创建</button>
            <button type="button" data-close-folder>取消</button>
          </div>
        </div>
      </div>
    </div>

    <div id="folderSitesModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-folder-sites></div>
      <div class="modal-card sm folder-sites-card">
        <header class="modal-head">
          <h2 id="folderSitesTitle">加入指定网站全部账号</h2>
          <button type="button" class="icon-btn" data-close-folder-sites>×</button>
        </header>
        <form id="folderSitesForm" class="modal-body">
          <label>网站（每行一个，支持网址或域名）
            <textarea id="folderSitesInput" rows="7" placeholder="github.com&#10;google.com"></textarea>
          </label>
          <label class="row-check"><input type="checkbox" id="folderAutoAdd" /> 后续自动加入匹配账号</label>
          <div class="form-actions">
            <button type="submit" class="primary">加入文件夹</button>
            <button type="button" data-close-folder-sites>取消</button>
          </div>
        </form>
      </div>
    </div>

    <div id="folderDedupModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-folder-dedup></div>
      <div class="modal-card wide folder-dedup-card">
        <header class="modal-head">
          <div>
            <h2 id="folderDedupTitle">文件夹内去重</h2>
            <p id="folderDedupSummary" class="hint"></p>
          </div>
          <button type="button" class="icon-btn" data-close-folder-dedup>×</button>
        </header>
        <div class="modal-body">
          <div class="dedup-toolbar">
            <button type="button" class="primary" id="btn-keep-latest">保留全部最新账号</button>
            <button type="button" id="btn-keep-earliest">保留全部最早账号</button>
          </div>
          <div id="folderDedupGroups" class="dedup-groups"></div>
        </div>
      </div>
    </div>

    <div id="folderDeleteModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-folder-delete></div>
      <div class="modal-card sm folder-delete-card">
        <header class="modal-head">
          <h2>删除文件夹</h2>
          <button type="button" class="icon-btn" data-close-folder-delete>×</button>
        </header>
        <div class="modal-body">
          <p id="folderDeleteMessage" class="delete-message"></p>
          <div class="form-actions">
            <button type="button" id="btn-confirm-folder-delete" class="danger">删除文件夹</button>
            <button type="button" data-close-folder-delete>取消</button>
          </div>
        </div>
      </div>
    </div>

    <div id="contextMenu" class="context-menu" hidden></div>

    <div id="settingsModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-settings></div>
      <div class="modal-card wide">
        <header class="modal-head">
          <h2>设置</h2>
          <button type="button" class="icon-btn" data-close-settings>×</button>
        </header>
        <nav class="settings-nav">
          <button type="button" class="nav-btn active" data-settings-tab="general">通用</button>
          <button type="button" class="nav-btn" data-settings-tab="sync">同步</button>
          <button type="button" class="nav-btn" data-settings-tab="lock">应用锁</button>
          <button type="button" class="nav-btn" data-settings-tab="tools">工具</button>
          <button type="button" class="nav-btn" data-settings-tab="debug">开发</button>
        </nav>
        <div class="modal-body">
          <section class="settings-pane active" data-pane="general">
            <label>设备名
              <div class="inline-actions">
                <input id="deviceName" />
                <button type="button" id="btn-save-device">保存</button>
              </div>
            </label>
          </section>
          <section class="settings-pane" data-pane="sync">
            <p class="hint">与 macOS 共用自建同步 <code>/v2/sync/state</code>。</p>
            <label class="row-check"><input type="checkbox" id="syncEnabled" /> 启用同步</label>
            <label>Base URL<input id="syncBaseUrl" /></label>
            <label>Bearer Token<input id="syncToken" type="password" /></label>
            <label>同步密钥（可选）
              <div class="inline-actions">
                <input id="syncEncKey" type="password" />
                <button type="button" id="btn-gen-sync-key">生成</button>
              </div>
            </label>
            <label>模式
              <select id="syncMode">
                <option value="merge">合并</option>
                <option value="remoteOverwriteLocal">云端覆盖本地</option>
                <option value="localOverwriteRemote">本地覆盖云端</option>
              </select>
            </label>
            <div class="form-actions">
              <button type="button" id="btn-save-sync">保存</button>
              <button type="button" id="btn-sync-preview">预览合并</button>
              <button type="button" id="btn-sync-now-settings">立即同步</button>
            </div>
            <pre id="syncPreviewOut" class="mini-log" hidden></pre>
          </section>
          <section class="settings-pane" data-pane="lock">
            <div id="lockStatus">状态：未启用</div>
            <label>主密码<input id="lockPassword" type="password" /></label>
            <label>确认<input id="lockPassword2" type="password" /></label>
            <label>空闲分钟<input id="idleMinutes" type="number" min="1" max="60" value="5" /></label>
            <div class="form-actions">
              <button type="button" id="btn-lock-enable">启用</button>
              <button type="button" id="btn-lock-disable">关闭</button>
              <button type="button" id="btn-lock-idle">保存空闲</button>
            </div>
          </section>
          <section class="settings-pane" data-pane="tools">
            <div class="form-actions">
              <button type="button" id="btn-export">导出 CSV</button>
              <button type="button" id="btn-demo">生成演示数据</button>
            </div>
          </section>
          <section class="settings-pane" data-pane="debug">
            <div class="form-actions">
              <button type="button" id="btn-health">健康检查</button>
              <button type="button" id="btn-open-merge">JSON 合并预览</button>
            </div>
            <pre id="debugOut" class="mini-log"></pre>
            <div id="mergePanel" hidden>
              <div class="merge-grid">
                <div>
                  <button type="button" id="btn-load-local">填充本地</button>
                  <textarea id="localPayload"></textarea>
                </div>
                <div>
                  <button type="button" id="btn-fill-empty-remote">空远端</button>
                  <button type="button" id="btn-clear-remote">清空</button>
                  <textarea id="remotePayload"></textarea>
                </div>
              </div>
              <button type="button" id="btn-merge-preview">运行</button>
              <div id="mergeResult" hidden>
                <div id="mergeSummary" class="mini-log"></div>
                <pre id="mergePayloadOut" class="mini-log"></pre>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
