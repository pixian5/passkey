<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Pass 扩展自动填充测试页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 16px system-ui, sans-serif; margin: 40px; max-width: 560px; }
    label { display: block; margin: 18px 0 6px; }
    input { box-sizing: border-box; font: inherit; padding: 8px; width: 100%; }
    button { margin-top: 22px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Pass 扩展自动填充测试</h1>
  <form id="login-form" autocomplete="on">
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" autocomplete="username">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <label for="otp">验证码</label>
    <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code">
    <button type="submit">登录</button>
  </form>
</body>
</html>
