name: Pass CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension_shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension_shared/package-lock.json
      - run: node ../../scripts/version.mjs check
      - run: npm ci
      - run: npm test
      - run: node ../../core/pass_core/js/check_merge_parity.mjs
      - run: npm run build

  sync-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync_server_ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s ../../scripts/tests -p 'test_*.py'

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/pass_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --workspace
      - run: node js/check_merge_parity.mjs
      - run: cargo build -p pass-core-ffi --release
      - run: ../../scripts/check_domain_ffi.sh

  macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/app_macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build_pass_core_ffi.sh
      - run: swift build

  desktop-tauri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/codex-tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install webkit/gtk deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo check
