name: Pass CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension_shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension_shared/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  sync-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync_server_ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p 'test_*.py'

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/pass_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/app_macos
    steps:
      - uses: actions/checkout@v4
      - run: swift build
