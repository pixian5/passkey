name: Pass CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension_shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension_shared/package-lock.json
      - run: node ../../scripts/version.mjs check
      - run: npm ci
      - run: npm test
      - run: npm run build

  sync-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync_server_ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s ../../scripts/tests -p 'test_*.py'

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/pass_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --workspace
      - run: cargo build -p pass-merge --bin pass-merge-cli
      - run: node js/check_merge_parity.mjs
      - run: cargo build -p pass-core-ffi --release
      - run: ../../scripts/check_domain_ffi.sh

  macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/app_macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build_pass_core_ffi.sh
      - run: swift build

  desktop-tauri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/codex-tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/codex-tauri/package-lock.json
      - name: Install webkit/gtk deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm --prefix .. ci
      - run: npm --prefix .. run prepare:dist
      - run: cargo test

  pass-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path apps/pass-web/Cargo.toml

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/codex-tauri/package-lock.json
      - name: Install Tauri clippy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Prepare Tauri frontend distribution
        run: |
          npm --prefix apps/codex-tauri ci
          npm --prefix apps/codex-tauri run prepare:dist
      - name: Version and embedded sync server drift
        run: node scripts/version.mjs check
      - name: Rustfmt
        run: |
          fmt_failed=0
          cargo fmt --manifest-path core/pass_core/Cargo.toml --all --check || fmt_failed=1
          cargo fmt --manifest-path apps/pass-web/Cargo.toml --check || fmt_failed=1
          cargo fmt --manifest-path apps/codex-tauri/src-tauri/Cargo.toml --check || fmt_failed=1
          exit "${fmt_failed}"
      - name: Clippy correctness (core/web/tauri)
        run: |
          cargo clippy --manifest-path core/pass_core/Cargo.toml --workspace --all-targets -- -D clippy::correctness -A warnings
          cargo clippy --manifest-path apps/pass-web/Cargo.toml --all-targets -- -D clippy::correctness -A warnings
          cargo clippy --manifest-path apps/codex-tauri/src-tauri/Cargo.toml --all-targets -- -D clippy::correctness -A warnings
      - name: Dependency advisories (informational)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --manifest-path core/pass_core/Cargo.toml || true
          cargo audit --manifest-path apps/pass-web/Cargo.toml || true
          cargo audit --manifest-path apps/codex-tauri/src-tauri/Cargo.toml || true
