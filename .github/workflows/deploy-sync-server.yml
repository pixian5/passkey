name: Deploy Sync Server

on:
  push:
    branches: [master]
    paths:
      - "apps/sync_server_ubuntu/**"
      - ".github/workflows/deploy-sync-server.yml"
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the sync host
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SYNC_SERVER_HOST }}
          username: ${{ secrets.SYNC_SERVER_USER }}
          key: ${{ secrets.SYNC_SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/pass-sync-server
            previous_revision=$(git rev-parse HEAD)
            stamp=$(date +%Y%m%d-%H%M%S)
            sudo mkdir -p "/var/lib/pass-sync/backups/${stamp}-pre-deploy"
            if [ -x ./apps/sync_server_ubuntu/backup_sync_db.sh ]; then
              sudo PASS_SYNC_BACKUP_DIR="/var/lib/pass-sync/backups/${stamp}-pre-deploy" ./apps/sync_server_ubuntu/backup_sync_db.sh
            else
              sudo cp -a /var/lib/pass-sync/pass_sync.sqlite3 "/var/lib/pass-sync/backups/${stamp}-pre-deploy/pass_sync.sqlite3"
            fi
            git fetch origin master
            git checkout -f origin/master
            if ! getent group pass >/dev/null 2>&1; then
              sudo groupadd --system pass
            fi
            if ! id -u pass >/dev/null 2>&1; then
              sudo useradd --system --gid pass --home-dir /nonexistent --shell /usr/sbin/nologin pass
            fi
            sudo install -d -m 0755 /etc/pass-sync /var/lib/pass-sync /var/lib/pass-sync/backups
            if [ -f /etc/pass-sync-server.env ] && [ ! -f /etc/pass-sync/pass-sync-server.env ]; then
              sudo install -m 0600 /etc/pass-sync-server.env /etc/pass-sync/pass-sync-server.env
            fi
            if [ -f /etc/bz/certs/server.crt ] && [ -f /etc/bz/certs/server.key ]; then
              sudo install -d -m 0750 -o pass -g pass /etc/pass-sync/tls
              sudo install -m 0644 -o pass -g pass /etc/bz/certs/server.crt /etc/pass-sync/tls/server.crt
              sudo install -m 0600 -o pass -g pass /etc/bz/certs/server.key /etc/pass-sync/tls/server.key
              if [ -f /etc/pass-sync/pass-sync-server.env ]; then
                sudo sed -i \
                  -e 's#^PASS_SYNC_TLS_CERT=.*#PASS_SYNC_TLS_CERT=/etc/pass-sync/tls/server.crt#' \
                  -e 's#^PASS_SYNC_TLS_KEY=.*#PASS_SYNC_TLS_KEY=/etc/pass-sync/tls/server.key#' \
                  /etc/pass-sync/pass-sync-server.env
              fi
            fi
            sudo chown -R pass:pass /var/lib/pass-sync
            sudo install -m 0644 apps/sync_server_ubuntu/pass-sync-server.service /etc/systemd/system/pass-sync-server.service
            sudo systemctl daemon-reload
            sudo systemctl restart pass-sync-server
            if ! curl --fail --silent --show-error --insecure https://127.0.0.1:5443/healthz >/dev/null; then
              echo "新版本健康检查失败，回滚到 ${previous_revision}" >&2
              git checkout -f "${previous_revision}"
              sudo systemctl restart pass-sync-server
              exit 1
            fi
