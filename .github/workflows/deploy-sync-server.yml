name: Deploy Sync Server

on:
  push:
    branches: [master]
    paths:
      - "apps/sync_server_ubuntu/**"
      - ".github/workflows/deploy-sync-server.yml"
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the sync host
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SYNC_SERVER_HOST }}
          username: ${{ secrets.SYNC_SERVER_USER }}
          key: ${{ secrets.SYNC_SERVER_SSH_KEY }}
          script: |
            set -eu
            stamp=$(date +%Y%m%d-%H%M%S)
            source_dir=/opt/pass-sync-source
            if [ -e "${source_dir}" ] && ! git -C "${source_dir}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              sudo mv "${source_dir}" "${source_dir}.invalid-${stamp}"
            fi
            if [ ! -d "${source_dir}/.git" ]; then
              sudo git clone --depth=1 --branch master https://github.com/pixian5/passkey.git "${source_dir}"
            else
              sudo git -C "${source_dir}" fetch origin master
              sudo git -C "${source_dir}" checkout -f origin/master
            fi
            source_revision=$(sudo git -C "${source_dir}" rev-parse HEAD)
            sudo env PASS_SYNC_SOURCE_REVISION="${source_revision}" \
              "${source_dir}/apps/sync_server_ubuntu/deploy.sh"
